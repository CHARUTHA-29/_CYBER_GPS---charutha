
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHARUTHA CYBER GPS</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #020b12;
  color: #00ff88;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 12px;
  text-align: center;
  background: #061925;
  border-bottom: 2px solid #00ff88;
}

header h1 {
  font-size: 23px;
  text-shadow: 0 0 12px #00ff88;
}

header p {
  color: #9bffc9;
  margin-top: 8px;
  font-size: 12px;
}

.container {
  padding: 15px;
}

.status {
  background: #09251e;
  padding: 15px;
  border: 1px solid #00ff88;
  border-radius: 10px;
  margin-bottom: 15px;
}

.status span {
  color: #00ff88;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border: 1px solid #00ff88;
  border-radius: 8px;
  background: #003c29;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

button:active {
  background: #008f60;
}

#map {
  height: 420px;
  width: 100%;
  border: 2px solid #00ff88;
  border-radius: 12px;
  margin-top: 15px;
}

.info {
  background: #061925;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
  line-height: 2;
  font-size: 13px;
}

footer {
  text-align: center;
  padding: 20px;
  color: #00ff88;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>CHARUTHA CYBER GPS</h1>
  <p>GLOBAL TRACKING DASHBOARD</p>
</header>

<div class="container">

  <div class="status">
    SYSTEM STATUS:
    <span id="status">READY</span>
  </div>

  <button onclick="startGPS()">
    START MY GPS
  </button>

  <button onclick="stopGPS()">
    STOP GPS
  </button>

  <div id="map"></div>

  <div class="info">
    <h3>DEVICE INFORMATION</h3>
    <p>Latitude: <span id="lat">---</span></p>
    <p>Longitude: <span id="lng">---</span></p>
    <p>Accuracy: <span id="accuracy">---</span></p>
    <p>GPS: <span id="gps">OFF</span></p>
  </div>

</div>

<footer>
  CHARUTHA CYBER GPS © 2026
  <br><br>
  Authorized device location only
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([7.8731, 80.7718], 7);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap'
  }
).addTo(map);

let marker = null;
let circle = null;
let watchID = null;

function startGPS() {

  if (!navigator.geolocation) {
    alert("GPS is not supported!");
    return;
  }

  document.getElementById("status").innerText =
    "WAITING FOR PERMISSION";

  watchID = navigator.geolocation.watchPosition(

    function(position) {

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      document.getElementById("lat").innerText = lat;
      document.getElementById("lng").innerText = lng;
      document.getElementById("accuracy").innerText =
        Math.round(accuracy) + " meters";

      document.getElementById("gps").innerText = "ACTIVE";
      document.getElementById("status").innerText = "CONNECTED";

      if (marker) {
        marker.setLatLng([lat, lng]);
        circle.setLatLng([lat, lng]);
        circle.setRadius(accuracy);
      } else {
        marker = L.marker([lat, lng]).addTo(map)
          .bindPopup("My Authorized Device").openPopup();

        circle = L.circle([lat, lng], {
          radius: accuracy,
          color: "#00ff88"
        }).addTo(map);
      }

      map.setView([lat, lng], 16);

    },

    function(error) {
      document.getElementById("status").innerText =
        "GPS ERROR: " + error.message;
    },

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );
}

function stopGPS() {

  if (watchID !== null) {
    navigator.geolocation.clearWatch(watchID);
    watchID = null;
  }

  document.getElementById("gps").innerText = "OFF";
  document.getElementById("status").innerText = "STOPPED";
}

</script>
</body>
</html>
